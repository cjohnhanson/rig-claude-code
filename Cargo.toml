[package]
name = "rig-claude-code"
version = "0.1.0"
edition = "2024"
# 1.88 stabilized let chains on edition 2024, which src/streaming.rs uses.
rust-version = "1.88"
license = "MIT"
description = "Unofficial rig completion model backed by the Claude Code CLI, authenticated by a Claude subscription instead of an API key."
repository = "https://github.com/cjohnhanson/rig-claude-code"
documentation = "https://docs.rs/rig-claude-code"
readme = "README.md"
keywords = ["rig", "claude", "llm", "agent", "anthropic"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-stream = "0.3.6"
# No default features: this crate makes no HTTP requests and uses no derive
# macros, so it must not pin a TLS backend for applications that wanted a
# different one.
rig-core = { version = "0.41", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
thiserror = "2"
# `time` is used directly for the turn deadlines. It reaches the build
# through reqwest today, which is an accident of rig-core's dependency
# graph rather than a guarantee.
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "macros"] }

[dev-dependencies]
futures = "0.3.34"
rig = "0.41"
# No default features: this crate makes no HTTP requests and uses no derive
# macros, so it must not pin a TLS backend for applications that wanted a
# different one.
rig-core = { version = "0.41", default-features = false }
schemars = "1"
serde_json = "1"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync"] }

[lints.rust]
# `forbid` would also bind the test targets, and one integration test must
# set a process-wide environment variable to prove it is stripped from the
# child. The library itself forbids unsafe via an inner attribute in lib.rs.
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
